<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B7A47">
    <title>DCLTP! - On donne pas conseils.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <div>
            <div class="logo" id="header-logo">DCLTP!</div>
            <div class="tagline" id="header-tagline">On donne pas conseils.</div>
        </div>
        <div class="status" id="headerStatus" role="status">● Invisible</div>
    </div>
</header>

<main id="app"></main>
<nav id="navigation" aria-label="Navigation principale"></nav>

<div id="toast-container" aria-live="polite"></div>

<div id="confirm-modal" class="modal hidden">
    <div class="modal-content" role="dialog" aria-modal="true">
        <h3 id="confirm-title">Confirmation</h3>
        <p id="confirm-message">Es-tu sûr ?</p>
        <div class="modal-actions">
            <button id="confirm-cancel" class="secondary">Annuler</button>
            <button id="confirm-ok" class="danger">Confirmer</button>
        </div>
    </div>
</div>

<!-- IMPORTANT : type="module" pour Firebase -->
<script type="module" src="app.js"></script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('✅ Service Worker OK'))
                .catch(err => console.log('❌ Erreur SW', err));
        });
    }
</script>
</body>
</html>
